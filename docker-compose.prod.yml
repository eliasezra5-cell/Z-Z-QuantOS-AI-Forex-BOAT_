# ---------------------------------------------------------------------------
# ZZ_QuantOS AI BOAT — Production stack (verified, single-node)
#
# Runs the two services that were verified end-to-end in development:
#   backend   FastAPI + Uvicorn on :3001 (JSON file store — no Postgres/Celery)
#   frontend  Nginx serving the built React app on :80, reverse-proxying
#             /api and /ws to the backend container.
#
# The full institutional stack (Postgres/pgvector + Redis + Celery) is the
# legacy docker-compose.yml and is NOT required for a live deployment.
#
# Usage:
#   cp .env.production.example .env    # then edit .env with your secrets
#   docker compose -f docker-compose.prod.yml up -d --build
# ---------------------------------------------------------------------------
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: quantos-backend:latest
    container_name: quantos-backend
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: "3001"
      HOST: 0.0.0.0
      POSTGRES_ENABLED: "false"
      CELERY_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      # Local AI (Ollama on the host machine). Overrides .env primary slot.
      USER_LLM_BASE_URL: http://host.docker.internal:11434/v1
      USER_LLM_API_KEY: ""
      USER_LLM_MODEL: qwen2.5:7b
    volumes:
      - ./backend-py/backend/data:/app/backend-py/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3001/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: quantos-frontend:latest
    container_name: quantos-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      QUANTOS_STANDALONE: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost/', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
