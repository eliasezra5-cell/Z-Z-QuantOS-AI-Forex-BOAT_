name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          cd backend-py
          pip install -r requirements.txt
          pip install pytest
      - name: Backend test suite
        run: |
          cd backend-py
          python -m pytest app/tests -q
      - name: Critical test gate marker
        run: |
          cd backend-py
          python scripts/write_critical_test_marker.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build -w frontend

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          cd backend-py
          pip install -r requirements.txt
      - name: Start backend and probe endpoints
        run: |
          cd backend-py
          python -m uvicorn app.main:app --host 0.0.0.0 --port 3001 > /tmp/backend.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          curl -sf http://localhost:3001/api/health
          curl -sf http://localhost:3001/api/market/quotes
          curl -sf http://localhost:3001/api/validation/suites
          kill $SERVER_PID

  docker:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile --target backend -t ${{ vars.REGISTRY }}/quantos/backend:latest .
          docker build -f docker/Dockerfile --target runtime -t ${{ vars.REGISTRY }}/quantos/frontend:latest .
